<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rime - Download the App</title>
    <script>
        (function () {
            var ua = navigator.userAgent || "";
            if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
                window.location.replace("https://apps.apple.com/us/app/rime-plans-made-easy/id6756951025");
            } else if (/android/i.test(ua)) {
                window.location.replace("https://play.google.com/store/apps/details?id=com.mcgworks.rime");
            } else {
                window.location.replace("https://apps.apple.com/us/app/rime-plans-made-easy/id6756951025");
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to the app store&hellip;</p>
</body>
</html>
