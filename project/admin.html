<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>McG Works — Project Board Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0b0f14;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Login gate ---------- */
    #gate { display: grid; place-items: center; height: 100vh; }
    .gate-card {
      width: 90%; max-width: 380px; padding: 40px 32px; border-radius: 16px;
      background: #1f2937; border: 1px solid #374151; text-align: center;
    }
    .gate-card h1 { margin: 0 0 6px; font-size: 26px; }
    .gate-card .subtitle { margin: 0 0 28px; font-size: 14px; opacity: 0.6; }
    .gate-card label {
      display: block; text-align: left; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; opacity: 0.5; margin: 12px 0 6px;
    }
    .gate-card input {
      width: 100%; padding: 12px 14px; font-size: 15px; border: 2px solid #374151;
      border-radius: 10px; background: #111827; color: #fff; outline: none;
    }
    .gate-card input:focus { border-color: #3b82f6; }
    .submit-btn {
      margin-top: 18px; width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
      border: none; border-radius: 10px; background: #3b82f6; color: #fff; cursor: pointer;
    }
    .submit-btn:hover { background: #2563eb; }
    .error-msg { margin-top: 12px; font-size: 13px; color: #ef4444; min-height: 18px; }

    /* ---------- App ---------- */
    #app { display: none; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; background: #111827; border-bottom: 1px solid #1e293b; flex-wrap: wrap;
    }
    .topbar h1 { font-size: 16px; margin: 0; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    select, .btn {
      padding: 8px 12px; border-radius: 8px; border: 1px solid #374151;
      background: #1f2937; color: #e2e8f0; font-size: 13px; cursor: pointer;
    }
    .btn.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .btn.danger { background: #7f1d1d; border-color: #7f1d1d; color: #fff; }

    .columns {
      display: grid; grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 16px; padding: 20px; max-width: 1300px; margin: 0 auto;
    }
    @media (max-width: 800px) { .columns { grid-template-columns: 1fr; } }
    .column {
      background: #111827; border: 1px solid #1e293b; border-radius: 12px; padding: 12px; min-height: 140px;
      display: flex; flex-direction: column;
    }
    .column h2 {
      font-size: 13px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.6;
      margin: 4px 8px 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .column h2 .count { background: #1e293b; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .card-list { flex: 1; min-height: 80px; }
    .card {
      background: #1f2937; border: 1px solid #374151; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 10px; cursor: grab;
    }
    .card.assignee-client { border-left: 3px solid #3b82f6; }
    .card.assignee-mcg { border-left: 3px solid #d4a94a; }
    .card.sortable-ghost { opacity: 0.4; }
    .card-title { font-weight: 600; font-size: 14px; color: #fff; margin: 0 0 4px; }
    .card-desc { font-size: 13px; opacity: 0.65; margin: 0 0 8px; white-space: pre-wrap; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badge {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
      padding: 2px 8px; border-radius: 20px;
    }
    .badge.client { background: #1e3a5f; color: #60a5fa; }
    .badge.mcg { background: #312e1e; color: #d4a94a; }
    .card-actions { display: flex; gap: 4px; }
    .icon-btn { background: none; border: none; color: #9ca3af; cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 6px; }
    .icon-btn:hover { background: #374151; color: #fff; }

    .edit-form, .add-form { margin-top: 8px; display: none; }
    .edit-form.visible, .add-form.visible { display: block; }
    .edit-form input, .edit-form textarea, .edit-form select,
    .add-form input, .add-form textarea, .add-form select {
      width: 100%; margin-bottom: 6px; padding: 8px; border-radius: 6px;
      border: 1px solid #374151; background: #0b0f14; color: #fff; font-family: inherit; font-size: 13px;
    }
    .form-actions { display: flex; gap: 6px; }
    .small-btn { font-size: 12px; padding: 6px 10px; border-radius: 6px; border: none; cursor: pointer; }
    .small-btn.save { background: #3b82f6; color: #fff; }
    .small-btn.cancel { background: #374151; color: #e2e8f0; }

    .add-card-btn {
      width: 100%; padding: 8px; margin-top: 4px; background: none; border: 1px dashed #374151;
      border-radius: 8px; color: #9ca3af; cursor: pointer; font-size: 13px;
    }
    .add-card-btn:hover { border-color: #3b82f6; color: #fff; }

    .comments-toggle { font-size: 12px; opacity: 0.5; margin-top: 8px; cursor: pointer; user-select: none; }
    .comments-toggle:hover { opacity: 0.8; }
    .comments-panel { display: none; margin-top: 8px; border-top: 1px solid #374151; padding-top: 8px; }
    .comments-panel.visible { display: block; }
    .comment { font-size: 12.5px; margin-bottom: 6px; padding: 6px 8px; background: #0b0f14; border-radius: 6px; }
    .comment .author { font-weight: 700; color: #93c5fd; }
    .comment.mcg .author { color: #d4a94a; }
    .comment-form { margin-top: 6px; }
    .comment-form textarea {
      width: 100%; font-size: 12.5px; padding: 6px 8px; border-radius: 6px;
      border: 1px solid #374151; background: #0b0f14; color: #fff; font-family: inherit; resize: vertical;
    }
    .comment-status { font-size: 11px; opacity: 0.5; margin-left: 6px; }
    .empty-state { padding: 40px; text-align: center; opacity: 0.5; }

    /* ---------- Activity log ---------- */
    .activity-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10;
    }
    .activity-overlay.visible { display: block; }
    .activity-panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: 360px; max-width: 90%;
      background: #111827; border-left: 1px solid #1e293b; z-index: 11;
      transform: translateX(100%); transition: transform 0.2s ease; display: flex; flex-direction: column;
    }
    .activity-panel.visible { transform: translateX(0); }
    .activity-panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid #1e293b;
    }
    .activity-panel-header h3 { margin: 0; font-size: 15px; color: #fff; }
    .activity-list { flex: 1; overflow-y: auto; padding: 12px 20px; }
    .activity-item { padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
    .activity-item:last-child { border-bottom: none; }
    .activity-item .activity-title { font-weight: 600; color: #fff; }
    .activity-item .activity-detail { opacity: 0.7; margin: 2px 0; }
    .activity-item .activity-time { opacity: 0.45; font-size: 11.5px; }

    /* ---------- Subscriber panel ---------- */
    .sub-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1e293b; font-size: 13px; }
    .sub-row:last-child { border-bottom: none; }
    .sub-row .sub-label { opacity: 0.6; }
    .sub-row .sub-value { color: #fff; font-weight: 600; }
    .sub-value.off { color: #6b7280; font-weight: 400; }

    /* ---------- Invite modal ---------- */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      z-index: 20; place-items: center;
    }
    .modal-overlay.visible { display: grid; }
    .modal-card {
      width: 90%; max-width: 480px; background: #1f2937; border: 1px solid #374151;
      border-radius: 14px; padding: 24px;
    }
    .modal-card h3 { margin: 0 0 16px; font-size: 17px; color: #fff; }
    .modal-card label {
      display: block; font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; opacity: 0.5; margin-bottom: 6px;
    }
    .modal-card input[type="email"], .modal-card input[type="text"], .modal-card textarea {
      width: 100%; padding: 10px 12px; margin-bottom: 16px; border: 2px solid #374151;
      border-radius: 8px; background: #111827; color: #fff; font-size: 14px; outline: none;
      font-family: inherit;
    }
    .modal-card textarea { resize: vertical; }
    .modal-card input:focus, .modal-card textarea:focus { border-color: #3b82f6; }
    .modal-actions { display: flex; gap: 8px; margin-top: 4px; align-items: center; }
    .modal-status { font-size: 12.5px; margin-left: 4px; align-self: center; opacity: 0.7; }
    .invite-body-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .invite-body-header label { margin-bottom: 0; }
    .link-btn {
      background: none; border: none; color: #3b82f6; font-size: 12px; font-weight: 600;
      cursor: pointer; padding: 0; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .link-btn:hover { text-decoration: underline; }
    .invite-preview-frame {
      display: none; width: 100%; height: 260px; margin-bottom: 16px; border: 2px solid #374151;
      border-radius: 8px; background: #0b0f14;
    }
    .invite-preview-frame.visible { display: block; }
    #inviteBody.hidden-while-previewing { display: none; }
  </style>
</head>
<body>

  <div id="gate">
    <div class="gate-card">
      <h1>McG Works</h1>
      <p class="subtitle">Project Board Admin</p>
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" />
      <button class="submit-btn" id="loginBtn">Log In</button>
      <p class="error-msg" id="loginError"></p>
    </div>
  </div>

  <div id="app">
    <div class="topbar">
      <h1>McG Works — Project Board Admin</h1>
      <div class="topbar-right">
        <select id="projectSelect"><option value="">Select a project…</option></select>
        <button class="btn" id="inviteBtn" disabled>Invite Client</button>
        <button class="btn" id="subscribersBtn" disabled>Email Subscribers</button>
        <button class="btn" id="activityBtn" disabled>Activity Log</button>
        <button class="btn" id="logoutBtn">Log Out</button>
      </div>
    </div>
    <div id="boardArea">
      <p class="empty-state">Select a project above to view its board.</p>
    </div>
  </div>

  <div class="activity-overlay" id="activityOverlay"></div>
  <div class="activity-panel" id="activityPanel">
    <div class="activity-panel-header">
      <h3>Activity Log</h3>
      <button class="icon-btn" id="closeActivityBtn">✕</button>
    </div>
    <div class="activity-list" id="activityList">Loading…</div>
  </div>

  <div class="activity-overlay" id="subscribersOverlay"></div>
  <div class="activity-panel" id="subscribersPanel">
    <div class="activity-panel-header">
      <h3>Email Subscribers</h3>
      <button class="icon-btn" id="closeSubscribersBtn">✕</button>
    </div>
    <div class="activity-list" id="subscribersList">Loading…</div>
  </div>

  <div class="modal-overlay" id="inviteOverlay">
    <div class="modal-card">
      <h3>Invite Client</h3>
      <label for="inviteTo">To</label>
      <input type="email" id="inviteTo" placeholder="client@example.com" />
      <label for="inviteSubject">Subject</label>
      <input type="text" id="inviteSubject" />
      <div class="invite-body-header">
        <label for="inviteBody">Body</label>
        <button type="button" class="link-btn" id="invitePreviewToggle">View HTML</button>
      </div>
      <textarea id="inviteBody" rows="9"></textarea>
      <iframe id="invitePreviewFrame" class="invite-preview-frame" title="Email preview"></iframe>
      <div class="modal-actions">
        <button class="small-btn save" id="inviteSendBtn">Send</button>
        <button class="small-btn cancel" id="inviteCancelBtn">Cancel</button>
        <span class="modal-status" id="inviteStatus"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script>
    const FUNCTIONS_BASE = 'https://awccquoyscijmtqtibgr.supabase.co/functions/v1';
    const SUPABASE_URL = 'https://awccquoyscijmtqtibgr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3Y2NxdW95c2Npam10cXRpYmdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDI0MDUsImV4cCI6MjA4MjM3ODQwNX0.zUBCXRah_oK8P_Q-1sFwZ5altAFUfZMOdBdY-tuXWrE';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const gateEl = document.getElementById('gate');
    const appEl = document.getElementById('app');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const projectSelect = document.getElementById('projectSelect');
    const boardArea = document.getElementById('boardArea');

    let accessToken = null;
    let currentProposalId = null;
    let tasksById = new Map();
    let boardReqToken = 0;
    let activeDrags = 0;
    let moveQueue = Promise.resolve();
    let projectsByPath = new Map();

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { loginError.textContent = 'Enter email and password.'; return; }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      loginBtn.disabled = false;
      loginBtn.textContent = 'Log In';

      if (error || !data?.session) {
        loginError.textContent = 'Invalid email or password.';
        return;
      }
      accessToken = data.session.access_token;
      showApp();
    }

    loginBtn.addEventListener('click', handleLogin);
    document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') handleLogin(); });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      accessToken = null;
      appEl.style.display = 'none';
      gateEl.style.display = 'grid';
    });

    // ---- restore existing Supabase Auth session, if any ----
    (async function tryRestore() {
      const { data } = await sb.auth.getSession();
      if (data?.session) {
        accessToken = data.session.access_token;
        showApp();
      }
    })();

    async function showApp() {
      gateEl.style.display = 'none';
      appEl.style.display = 'block';
      await loadProjects();
    }

    async function apiFetch(action, extra = {}) {
      const res = await fetch(FUNCTIONS_BASE + '/project-tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken },
        body: JSON.stringify({ action, ...extra })
      });
      return res.json();
    }

    async function loadProjects() {
      const result = await apiFetch('admin_list_projects');
      if (result.error) { loginError.textContent = ''; boardArea.innerHTML = `<p class="empty-state">${escHtml(result.error)}</p>`; return; }
      projectsByPath = new Map(result.projects.map((p) => [p.proposal_path, p]));
      projectSelect.innerHTML = '<option value="">Select a project…</option>' +
        result.projects.map((p) => `<option value="${escAttr(p.proposal_path)}">${escHtml(p.client_name || p.proposal_path)}</option>`).join('');
    }

    projectSelect.addEventListener('change', () => {
      currentProposalId = projectSelect.value || null;
      document.getElementById('activityBtn').disabled = !currentProposalId;
      document.getElementById('subscribersBtn').disabled = !currentProposalId;
      document.getElementById('inviteBtn').disabled = !currentProposalId;
      if (currentProposalId) loadBoard();
      else boardArea.innerHTML = '<p class="empty-state">Select a project above to view its board.</p>';
    });

    const activityPanel = document.getElementById('activityPanel');
    const activityOverlay = document.getElementById('activityOverlay');

    function openActivity() {
      if (!currentProposalId) return;
      activityPanel.classList.add('visible');
      activityOverlay.classList.add('visible');
      loadEvents();
    }
    function closeActivity() {
      activityPanel.classList.remove('visible');
      activityOverlay.classList.remove('visible');
    }
    document.getElementById('activityBtn').addEventListener('click', openActivity);
    document.getElementById('closeActivityBtn').addEventListener('click', closeActivity);
    activityOverlay.addEventListener('click', closeActivity);

    const STATUS_LABELS = { todo: 'To Do', doing: 'Doing', done: 'Done' };

    async function loadEvents() {
      const listEl = document.getElementById('activityList');
      listEl.textContent = 'Loading…';
      const result = await apiFetch('admin_list_events', { proposal_id: currentProposalId });
      if (result.error || !result.events) { listEl.textContent = 'Failed to load activity log.'; return; }
      listEl.innerHTML = result.events.length
        ? result.events.map(eventHtml).join('')
        : '<p style="opacity:0.5;font-size:12px;">No activity yet.</p>';
    }

    function eventHtml(e) {
      const time = new Date(e.created_at).toLocaleString();
      const detail = e.event_type === 'created'
        ? `Created in ${STATUS_LABELS[e.to_status] || e.to_status}`
        : `Moved ${STATUS_LABELS[e.from_status] || e.from_status} → ${STATUS_LABELS[e.to_status] || e.to_status}`;
      return `
        <div class="activity-item">
          <div class="activity-title">${escHtml(e.task_title)}</div>
          <div class="activity-detail">${detail} · ${escHtml(e.actor)}</div>
          <div class="activity-time">${escHtml(time)}</div>
        </div>`;
    }

    const subscribersPanel = document.getElementById('subscribersPanel');
    const subscribersOverlay = document.getElementById('subscribersOverlay');

    function openSubscribers() {
      if (!currentProposalId) return;
      subscribersPanel.classList.add('visible');
      subscribersOverlay.classList.add('visible');
      loadSubscription();
    }
    function closeSubscribers() {
      subscribersPanel.classList.remove('visible');
      subscribersOverlay.classList.remove('visible');
    }
    document.getElementById('subscribersBtn').addEventListener('click', openSubscribers);
    document.getElementById('closeSubscribersBtn').addEventListener('click', closeSubscribers);
    subscribersOverlay.addEventListener('click', closeSubscribers);

    async function loadSubscription() {
      const listEl = document.getElementById('subscribersList');
      listEl.textContent = 'Loading…';
      const result = await apiFetch('admin_get_subscription', { proposal_id: currentProposalId });
      if (result.error || !result.subscription) { listEl.textContent = 'Failed to load subscriber info.'; return; }
      const s = result.subscription;
      if (!s.email) { listEl.innerHTML = '<p style="opacity:0.5;font-size:12px;">Client has not set up email updates yet.</p>'; return; }
      const flag = (on) => `<span class="sub-value${on ? '' : ' off'}">${on ? 'On' : 'Off'}</span>`;
      listEl.innerHTML = `
        <div class="sub-row"><span class="sub-label">Email</span><span class="sub-value">${escHtml(s.email)}</span></div>
        <div class="sub-row"><span class="sub-label">New task created for them</span>${flag(s.notify_new_task)}</div>
        <div class="sub-row"><span class="sub-label">Task status changes</span>${flag(s.notify_task_moved)}</div>
        <div class="sub-row"><span class="sub-label">New comments</span>${flag(s.notify_comment)}</div>
      `;
    }

    const inviteOverlay = document.getElementById('inviteOverlay');
    const inviteStatus = document.getElementById('inviteStatus');

    function openInvite() {
      if (!currentProposalId) return;
      const project = projectsByPath.get(currentProposalId);
      const clientName = project?.client_name || currentProposalId;
      const code = project?.code || '';
      document.getElementById('inviteTo').value = '';
      document.getElementById('inviteSubject').value = 'McG Works Project Review Board';
      document.getElementById('inviteBody').value =
        `Hi ${clientName} team!\n\n` +
        `Jalen here from McG Works. We'd like to invite you to view your McG Works project board! On this board, you can track progress with your project, see what's been done, see what we need from you, and add comments.\n\n` +
        `Your project access code is the same as your proposal code: ${code}\n\n` +
        `Excited to continue working together!\nJalen`;
      inviteStatus.textContent = '';
      invitePreviewing = false;
      invitePreviewFrame.classList.remove('visible');
      document.getElementById('inviteBody').classList.remove('hidden-while-previewing');
      invitePreviewToggle.textContent = 'View HTML';
      inviteOverlay.classList.add('visible');
    }
    function closeInvite() {
      inviteOverlay.classList.remove('visible');
    }
    document.getElementById('inviteBtn').addEventListener('click', openInvite);
    document.getElementById('inviteCancelBtn').addEventListener('click', closeInvite);

    // Mirrors the HTML the admin_send_invite Edge Function actually sends
    function buildInviteEmailHtml(bodyText) {
      const bodyHtml = escHtml(bodyText).replace(
        /(https?:\/\/[^\s<]+)/g,
        '<a href="$1" style="color:#3b82f6">$1</a>'
      );
      return `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background:#0b0f14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <div style="max-width:520px;margin:2rem auto;background:#111827;border-radius:12px;overflow:hidden;border:1px solid #1e293b">
    <div style="padding:1.5rem 1.75rem;border-bottom:1px solid #1e293b">
      <div style="font-size:1.2rem;font-weight:700;color:#fff">McG Works</div>
    </div>
    <div style="padding:1.75rem;color:#e2e8f0;white-space:pre-wrap;font-size:.95rem;line-height:1.6">${bodyHtml}</div>
    <div style="padding:0 1.75rem 1.75rem">
      <a href="https://www.mcg-works.com/project" style="display:inline-block;background:#3b82f6;color:#fff;text-decoration:none;padding:.65rem 1.5rem;border-radius:8px;font-size:.88rem;font-weight:700">View Your Project</a>
    </div>
  </div>
</body>
</html>`;
    }

    const invitePreviewFrame = document.getElementById('invitePreviewFrame');
    const invitePreviewToggle = document.getElementById('invitePreviewToggle');
    const inviteBodyField = document.getElementById('inviteBody');
    let invitePreviewing = false;

    invitePreviewToggle.addEventListener('click', () => {
      invitePreviewing = !invitePreviewing;
      if (invitePreviewing) {
        invitePreviewFrame.srcdoc = buildInviteEmailHtml(inviteBodyField.value);
        invitePreviewFrame.classList.add('visible');
        inviteBodyField.classList.add('hidden-while-previewing');
        invitePreviewToggle.textContent = 'Edit';
      } else {
        invitePreviewFrame.classList.remove('visible');
        inviteBodyField.classList.remove('hidden-while-previewing');
        invitePreviewToggle.textContent = 'View HTML';
      }
    });

    document.getElementById('inviteSendBtn').addEventListener('click', async () => {
      const to_email = document.getElementById('inviteTo').value.trim();
      const subject = document.getElementById('inviteSubject').value.trim();
      const body = document.getElementById('inviteBody').value.trim();
      if (!to_email) { inviteStatus.textContent = 'Recipient email is required.'; return; }
      if (!subject || !body) { inviteStatus.textContent = 'Subject and body are required.'; return; }
      inviteStatus.textContent = 'Sending…';
      const result = await apiFetch('admin_send_invite', { proposal_id: currentProposalId, to_email, subject, body });
      if (result.error) { inviteStatus.textContent = 'Failed to send.'; return; }
      inviteStatus.textContent = 'Sent!';
      setTimeout(closeInvite, 700);
    });

    async function loadBoard() {
      if (activeDrags > 0) return;
      const token = ++boardReqToken;
      const result = await apiFetch('admin_list_tasks', { proposal_id: currentProposalId });
      if (token !== boardReqToken) return; // a newer request already superseded this one
      if (result.error) { boardArea.innerHTML = `<p class="empty-state">${escHtml(result.error)}</p>`; return; }
      tasksById = new Map(result.tasks.map((t) => [t.id, t]));
      renderBoard(result.tasks);
    }

    function renderBoard(tasks) {
      boardArea.innerHTML = `
        <div class="columns">
          ${['todo', 'doing', 'done'].map((status) => columnHtml(status, tasks)).join('')}
        </div>`;

      ['todo', 'doing', 'done'].forEach((status) => {
        document.getElementById('addbtn-' + status).addEventListener('click', () => toggleAddForm(status));
        document.getElementById('addsave-' + status).addEventListener('click', () => createCard(status));
        document.getElementById('addcancel-' + status).addEventListener('click', () => toggleAddForm(status, false));
      });

      document.querySelectorAll('.card').forEach((card) => {
        const id = card.dataset.id;
        card.querySelector('.edit-btn').addEventListener('click', () => toggleEdit(id));
        card.querySelector('.save-btn').addEventListener('click', () => saveEdit(id));
        card.querySelector('.cancel-btn').addEventListener('click', () => toggleEdit(id, false));
        card.querySelector('.delete-btn').addEventListener('click', () => deleteCard(id));
        card.querySelector('.comments-toggle').addEventListener('click', () => toggleComments(id));
        card.querySelector('.comment-submit').addEventListener('click', () => postComment(id));
      });

      setupSortable();
    }

    function columnHtml(status, tasks) {
      const items = tasks.filter((t) => t.status === status).sort((a, b) => a.sort_order - b.sort_order);
      const label = status === 'todo' ? 'To Do' : status === 'doing' ? 'Doing' : 'Done';
      return `
        <div class="column" data-status="${status}">
          <h2>${label} <span class="count">${items.length}</span></h2>
          <div class="card-list" id="list-${status}">${items.map(cardHtml).join('')}</div>
          <button class="add-card-btn" id="addbtn-${status}">+ Add card</button>
          <div class="add-form" id="addform-${status}">
            <input type="text" class="add-title" placeholder="Title" />
            <textarea class="add-desc" rows="2" placeholder="Description (optional)"></textarea>
            <select class="add-assignee">
              <option value="mcg">McG Works</option>
              <option value="client">Client</option>
            </select>
            <div class="form-actions">
              <button class="small-btn save" id="addsave-${status}">Add</button>
              <button class="small-btn cancel" id="addcancel-${status}">Cancel</button>
            </div>
          </div>
        </div>`;
    }

    function cardHtml(t) {
      const isClient = t.assignee === 'client';
      return `
        <div class="card assignee-${t.assignee}" data-id="${t.id}">
          <p class="card-title">${escHtml(t.title)}</p>
          ${t.description ? `<p class="card-desc">${escHtml(t.description)}</p>` : ''}
          <div class="card-meta">
            <span class="badge ${isClient ? 'client' : 'mcg'}">${isClient ? 'Client' : 'McG Works'}</span>
            <div class="card-actions">
              <button class="icon-btn edit-btn">Edit</button>
              <button class="icon-btn delete-btn">Delete</button>
            </div>
          </div>
          <div class="edit-form" id="edit-${t.id}">
            <input type="text" class="edit-title" value="${escAttr(t.title)}" />
            <textarea class="edit-desc" rows="2">${escHtml(t.description || '')}</textarea>
            <select class="edit-assignee">
              <option value="mcg" ${!isClient ? 'selected' : ''}>McG Works</option>
              <option value="client" ${isClient ? 'selected' : ''}>Client</option>
            </select>
            <div class="form-actions">
              <button class="small-btn save save-btn">Save</button>
              <button class="small-btn cancel cancel-btn">Cancel</button>
            </div>
          </div>
          <div class="comments-toggle">💬 Comments</div>
          <div class="comments-panel" id="comments-${t.id}">
            <div class="comments-list">Loading…</div>
            <div class="comment-form">
              <textarea class="comment-body" rows="2" placeholder="Reply as McG Works…"></textarea>
              <button class="small-btn save comment-submit">Post</button>
              <span class="comment-status"></span>
            </div>
          </div>
        </div>`;
    }

    function toggleAddForm(status, show) {
      const el = document.getElementById('addform-' + status);
      if (show === false) { el.classList.remove('visible'); return; }
      el.classList.toggle('visible');
    }

    async function createCard(status) {
      const form = document.getElementById('addform-' + status);
      const title = form.querySelector('.add-title').value.trim();
      const description = form.querySelector('.add-desc').value.trim();
      const assignee = form.querySelector('.add-assignee').value;
      if (!title) return;
      await apiFetch('admin_create_task', { proposal_id: currentProposalId, title, description, status, assignee });
      loadBoard();
    }

    function toggleEdit(id, show) {
      const el = document.getElementById('edit-' + id);
      if (show === false) { el.classList.remove('visible'); return; }
      el.classList.toggle('visible');
    }

    async function saveEdit(id) {
      const el = document.getElementById('edit-' + id);
      const title = el.querySelector('.edit-title').value.trim();
      const description = el.querySelector('.edit-desc').value.trim();
      const assignee = el.querySelector('.edit-assignee').value;
      if (!title) return;
      await apiFetch('admin_update_task', { task_id: id, title, description, assignee });
      loadBoard();
    }

    async function deleteCard(id) {
      if (!confirm('Delete this card? This cannot be undone.')) return;
      await apiFetch('admin_delete_task', { task_id: id });
      loadBoard();
    }

    function toggleComments(id) {
      const panel = document.getElementById('comments-' + id);
      panel.classList.toggle('visible');
      if (panel.classList.contains('visible')) loadComments(id);
    }

    async function loadComments(id) {
      const panel = document.getElementById('comments-' + id);
      const result = await apiFetch('admin_list_comments', { task_id: id });
      const listEl = panel.querySelector('.comments-list');
      if (result.error) { listEl.textContent = 'Failed to load comments.'; return; }
      listEl.innerHTML = result.comments.length
        ? result.comments.map((c) => `
            <div class="comment ${c.is_mcg ? 'mcg' : ''}">
              <span class="author">${escHtml(c.author_name)}</span> — ${escHtml(c.content)}
            </div>`).join('')
        : '<p style="opacity:0.5;font-size:12px;">No comments yet.</p>';
    }

    async function postComment(id) {
      const panel = document.getElementById('comments-' + id);
      const textarea = panel.querySelector('.comment-body');
      const statusEl = panel.querySelector('.comment-status');
      const content = textarea.value.trim();
      if (!content) return;
      statusEl.textContent = 'Posting…';
      const result = await apiFetch('admin_create_comment', { task_id: id, proposal_id: currentProposalId, content });
      if (result.error) { statusEl.textContent = 'Failed.'; return; }
      textarea.value = '';
      statusEl.textContent = '';
      loadComments(id);
    }

    function setupSortable() {
      ['todo', 'doing', 'done'].forEach((status) => {
        const list = document.getElementById('list-' + status);
        Sortable.create(list, {
          group: 'admin-board',
          animation: 150,
          emptyInsertThreshold: 30,
          swapThreshold: 0.65,
          fallbackTolerance: 3,
          onStart: () => { activeDrags++; },
          onEnd: () => {
            // Chain onto moveQueue so overlapping drags hit the server in the order they happened,
            // not the order their responses happen to arrive back in.
            moveQueue = moveQueue
              .then(() => {
                const updates = [];
                ['todo', 'doing', 'done'].forEach((s) => {
                  [...document.getElementById('list-' + s).children].forEach((el, index) => {
                    const id = el.dataset.id;
                    const task = tasksById.get(id);
                    if (task && (task.status !== s || task.sort_order !== index)) {
                      updates.push(apiFetch('admin_update_task', { task_id: id, status: s, sort_order: index }));
                    }
                  });
                });
                return Promise.all(updates);
              })
              .finally(() => {
                activeDrags = Math.max(0, activeDrags - 1);
                if (activeDrags === 0) loadBoard();
              });
          }
        });
      });
    }

    function escHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escAttr(s) { return escHtml(s); }
  </script>
</body>
</html>
