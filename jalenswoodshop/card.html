<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jalen's Woodshop</title>
    <meta name="description" content="Handcrafted wood projects by Jalen McGee — built to last.">

    <!-- Open Graph for link previews -->
    <meta property="og:title" content="Jalen's Woodshop">
    <meta property="og:description" content="Handcrafted wood projects — built to last.">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --brown-dark:  #3d2f20;
            --brown-mid:   #5d4e37;
            --brown-warm:  #8b7355;
            --brown-light: #b8976a;
            --cream:       #f5f1e8;
            --cream-dark:  #e8dcc8;
            --text-dark:   #2a2018;
            --text-mid:    #5d4e37;
            --text-light:  #7a6a55;
        }

        body {
            font-family: 'Georgia', serif;
            background: var(--brown-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ── CARD ─────────────────────────────────────────── */
        .card {
            background: var(--cream);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        /* ── HEADER BAND ──────────────────────────────────── */
        .card-header {
            background: linear-gradient(160deg, var(--brown-mid) 0%, var(--brown-dark) 100%);
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        /* Wood grain texture overlay */
        .card-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                92deg,
                transparent 0px,
                transparent 18px,
                rgba(255,255,255,0.025) 18px,
                rgba(255,255,255,0.025) 19px
            );
            border-radius: 24px 24px 0 0;
            pointer-events: none;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brown-warm) 0%, var(--brown-light) 100%);
            border: 3px solid rgba(255,255,255,0.2);
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.6rem;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card-name {
            color: #fff;
            font-size: 1.7rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .card-title {
            color: var(--brown-light);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 0.3rem;
            position: relative;
            z-index: 1;
        }

        .card-tagline {
            color: rgba(255,255,255,0.65);
            font-size: 0.85rem;
            font-style: italic;
            margin-top: 0.5rem;
            position: relative;
            z-index: 1;
        }

        /* ── DIVIDER ──────────────────────────────────────── */
        .divider {
            height: 3px;
            background: linear-gradient(90deg, var(--brown-mid), var(--brown-light), var(--brown-mid));
        }

        /* ── BODY ─────────────────────────────────────────── */
        .card-body {
            padding: 1.75rem 1.75rem 0.5rem;
        }

        /* ── CONTACT LINKS ────────────────────────────────── */
        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            list-style: none;
        }

        .contact-list a {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--cream-dark);
            color: var(--text-dark);
            text-decoration: none;
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: background 0.2s, transform 0.15s;
        }

        .contact-list a:hover,
        .contact-list a:focus {
            background: #ddd0b8;
            transform: translateX(3px);
            outline: none;
        }

        .contact-list a:active {
            transform: scale(0.98);
        }

        .contact-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brown-mid) 0%, var(--brown-warm) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            color: #fff;
        }

        .contact-text {
            display: flex;
            flex-direction: column;
        }

        .contact-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
        }

        .contact-value {
            font-size: 0.95rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* ── SECTION HEADING ──────────────────────────────── */
        .section-heading {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-light);
            margin: 1.5rem 0 0.75rem;
        }

        /* ── SHOP LINK ────────────────────────────────────── */
        .shop-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--brown-mid) 0%, var(--brown-dark) 100%);
            color: #fff;
            text-decoration: none;
            padding: 1rem 1.2rem;
            border-radius: 14px;
            transition: opacity 0.2s, transform 0.15s;
        }

        .shop-link:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .shop-link-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .shop-link-icon {
            font-size: 1.6rem;
        }

        .shop-link-text .shop-link-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.75;
        }

        .shop-link-text .shop-link-name {
            font-size: 1rem;
            font-weight: bold;
        }

        .shop-link-arrow {
            font-size: 1.2rem;
            opacity: 0.7;
        }

        /* ── SOCIAL ROW ───────────────────────────────────── */
        .social-row {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            margin: 1.25rem 0 0;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--cream-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 1.15rem;
            transition: background 0.2s, transform 0.15s;
            color: var(--brown-mid);
        }

        .social-btn:hover {
            background: #ddd0b8;
            transform: translateY(-2px);
        }

        /* ── SAVE CONTACT ─────────────────────────────────── */
        .save-btn {
            display: block;
            width: 100%;
            margin: 1.5rem 0 0;
            padding: 1rem;
            background: transparent;
            border: 2px solid var(--brown-warm);
            border-radius: 14px;
            color: var(--brown-mid);
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 0.5px;
            transition: background 0.2s, color 0.2s;
        }

        .save-btn:hover {
            background: var(--brown-warm);
            color: #fff;
        }

        /* ── FOOTER ───────────────────────────────────────── */
        .card-footer {
            padding: 1rem 1.75rem 1.5rem;
            text-align: center;
        }

        .card-footer p {
            font-size: 0.75rem;
            color: var(--text-light);
            font-style: italic;
        }

        /* ── RESPONSIVE TWEAKS ────────────────────────────── */
        @media (max-width: 400px) {
            body { padding: 1rem; }
            .card-name { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ── HEADER ──────────────────────────────────────────── -->
    <div class="card-header">
        <div class="avatar">
            <img src="photo.jpg" alt="Jalen McGee">
        </div>
        <h1 class="card-name">Jalen McGee</h1>
        <p class="card-title">Woodworker &amp; Craftsman</p>
        <p class="card-tagline">Handcrafted with care, built to last</p>
    </div>

    <div class="divider"></div>

    <!-- ── BODY ────────────────────────────────────────────── -->
    <div class="card-body">

        <!-- Contact -->
        <ul class="contact-list">
            <li>
                <a href="tel:+19196140457">
                    <span class="contact-icon">📞</span>
                    <span class="contact-text">
                        <span class="contact-label">Call</span>
                        <span class="contact-value">(919) 614-0457</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="sms:+19196140457">
                    <span class="contact-icon">💬</span>
                    <span class="contact-text">
                        <span class="contact-label">Text</span>
                        <span class="contact-value">(919) 614-0457</span>
                    </span>
                </a>
            </li>
            <li>
                <a href="mailto:jalen@mcg-works.com">
                    <span class="contact-icon">✉️</span>
                    <span class="contact-text">
                        <span class="contact-label">Email</span>
                        <span class="contact-value">jalen@mcg-works.com</span>
                    </span>
                </a>
            </li>
        </ul>

        <!-- Shop -->
        <p class="section-heading">Shop</p>
        <a href="/jalenswoodshop/" class="shop-link">
            <span class="shop-link-left">
                <span class="shop-link-icon">🪵</span>
                <span class="shop-link-text">
                    <span class="shop-link-label">Browse</span>
                    <span class="shop-link-name">Jalen's Woodshop</span>
                </span>
            </span>
            <span class="shop-link-arrow">→</span>
        </a>

        <!-- Social -->
        <p class="section-heading">Find Me Online</p>
        <div class="social-row">
            <a href="https://instagram.com/jalenswoodshop" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram" title="Instagram">
                <!-- Instagram icon (SVG) -->
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                    <circle cx="12" cy="12" r="4"/>
                    <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
                </svg>
            </a>
            <a href="#" class="social-btn" aria-label="Facebook" title="Facebook" style="display:none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                </svg>
            </a>
            <a href="https://tiktok.com/@jalenswoodshop" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="TikTok" title="TikTok">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/>
                </svg>
            </a>
            <a href="#" class="social-btn" aria-label="Etsy" title="Etsy" style="display:none">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 3H4v18h6V3zm10 0h-6v7h6V3zm0 11h-6v7h6v-7z"/>
                </svg>
            </a>
        </div>

        <!-- Save Contact -->
        <button class="save-btn" onclick="saveContact()">+ Save Contact</button>

    </div>

    <!-- ── FOOTER ───────────────────────────────────────────── -->
    <div class="card-footer">
        <p>Jalen's Woodshop &mdash; Est. 2024</p>
    </div>

</div>

<script>
    function saveContact() {
        // ── vCard data ────────────────────────────────────────────────
        // Update these values to match your real contact info
        const vcard = [
            'BEGIN:VCARD',
            'VERSION:3.0',
            'FN:Jalen McGee',
            'ORG:Jalen\'s Woodshop',
            'TITLE:Woodworker & Craftsman',
            'TEL;TYPE=CELL:(919) 614-0457',
            'EMAIL:jalen@mcg-works.com',
            'URL:https://mcg.works/jalenswoodshop/',
            'NOTE:Handcrafted with care\\, built to last.',
            'END:VCARD'
        ].join('\n');

        const blob = new Blob([vcard], { type: 'text/vcard' });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement('a');
        a.href     = url;
        a.download = 'JalenMcGee-Woodshop.vcf';
        a.click();
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
