<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jalen's Woodshop - Handcrafted Wood Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%);
            color: #3a3a3a;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #5d4e37 0%, #4a3f2e 100%);
            color: #f5f1e8;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }
        .cart-btn {
            position: absolute; top: 1rem; right: 1.25rem;
            background: rgba(255,255,255,.15); border: none; color: #fff; padding: .45rem .8rem;
            border-radius: 6px; font-size: .88rem; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: .35rem;
        }
        .cart-btn:hover { background: rgba(255,255,255,.25); }
        .cart-badge { background: #b8976a; color: #fff; font-size: .7rem; font-weight: 700; border-radius: 20px; padding: .05rem .4rem; min-width: 1.1rem; text-align: center; }

        header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.5rem;
            color: #5d4e37;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2.5rem;
            margin-top: 2rem;
        }

        .item-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .item-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        .item-image {
            width: 100%;
            height: 280px;
            object-fit: cover;
            background: #e8dcc8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* video overlay on item card */
        .card-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 1;
        }

        .card-video-icon {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            z-index: 2;
            pointer-events: none;
        }

        @media (hover: hover) {
            /* on hover-capable devices the video plays — icon not needed */
            .card-video-icon { display: none; }
        }

        /* ── CAROUSEL ───────────────────────────── */
        .carousel {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.3s ease;
        }

        .carousel-slide {
            flex: 0 0 100%;
            height: 100%;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.35);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            cursor: pointer;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .carousel-btn.prev { left: 6px; }
        .carousel-btn.next { right: 6px; }

        .carousel-dots {
            position: absolute;
            bottom: 7px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            z-index: 2;
        }

        .carousel-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255,255,255,0.55);
            cursor: pointer;
            transition: background 0.2s;
        }

        .carousel-dot.active { background: #fff; }

        .item-details {
            padding: 1.5rem;
        }

        .item-name {
            font-size: 1.5rem;
            color: #5d4e37;
            margin-bottom: 0.25rem;
            font-weight: bold;
        }

        .item-tagline {
            font-size: 0.9rem;
            color: #8b7355;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .item-description {
            color: #666;
            margin-bottom: 1rem;
            line-height: 1.5;
        }

        .item-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .item-price {
            font-size: 1.8rem;
            color: #5d4e37;
            font-weight: bold;
        }

        .purchase-btn {
            background: linear-gradient(135deg, #8b7355 0%, #6d5a44 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.8rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .purchase-btn:hover {
            background: linear-gradient(135deg, #6d5a44 0%, #5d4e37 100%);
            transform: scale(1.05);
        }

        .purchase-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 2.5rem;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #000;
        }

        .modal h2 {
            color: #5d4e37;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #5d4e37;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #e8dcc8;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #8b7355;
        }

        .submit-btn {
            background: linear-gradient(135deg, #8b7355 0%, #6d5a44 100%);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
        }

        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #6d5a44 0%, #5d4e37 100%);
            transform: scale(1.02);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            display: none;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                margin: 20% auto;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="photo.jpg" alt="Jalen McGee" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,0.25);margin-bottom:1rem;display:block;margin-left:auto;margin-right:auto;">
        <h1>🪵 Jalen's Woodshop</h1>
        <p>Handmade, Unique wood art, Made in Durham, NC</p>
    </header>

    <div class="container">
        <div class="loading" id="loading">Loading items...</div>
        <div class="items-grid" id="itemsGrid"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ═══════════════════════════════════════════════════════════════
        // 🔧 CONFIGURATION - FILL IN YOUR SUPABASE DETAILS BELOW
        // ═══════════════════════════════════════════════════════════════
        // Get these from: Supabase Dashboard → Settings → API
        
        const SUPABASE_URL = 'https://awccquoyscijmtqtibgr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF3Y2NxdW95c2Npam10cXRpYmdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MDI0MDUsImV4cCI6MjA4MjM3ODQwNX0.zUBCXRah_oK8P_Q-1sFwZ5altAFUfZMOdBdY-tuXWrE';
        
        // ═══════════════════════════════════════════════════════════════
        // ⚠️  DO NOT EDIT ANYTHING BELOW THIS LINE
        // ═══════════════════════════════════════════════════════════════

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loading = document.getElementById('loading');
        const itemsGrid = document.getElementById('itemsGrid');

        // Get public URL for images stored in Supabase Storage
        function getImageUrl(imagePath) {
            if (!imagePath) return null;
            if (imagePath.startsWith('http')) return imagePath;
            if (imagePath.length < 10) return imagePath;
            const { data } = sb.storage.from('item-images').getPublicUrl(imagePath);
            return data.publicUrl;
        }

        function playCardVideo(imgWrap) {
            const video = imgWrap.querySelector('.card-video');
            if (!video) return;
            video.style.opacity = '1';
            video.play().catch(() => {});
        }

        function pauseCardVideo(imgWrap) {
            const video = imgWrap.querySelector('.card-video');
            if (!video) return;
            video.style.opacity = '0';
            video.pause();
            video.currentTime = 0;
        }

        async function loadItems() {
            try {
                const { data, error } = await sb
                    .from('items')
                    .select('*')
                    .eq('available', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                loading.style.display = 'none';

                if (data.length === 0) {
                    itemsGrid.innerHTML = '<p style="text-align: center; color: #666;">No items available at the moment. Check back soon!</p>';
                    return;
                }

                itemsGrid.innerHTML = data.map(item => {
                    // Gather all image paths (multi-photo or legacy single)
                    const paths = Array.isArray(item.image_paths) && item.image_paths.length
                        ? item.image_paths
                        : (item.image_path || item.image_url ? [item.image_path || item.image_url] : []);

                    let imageContent;
                    if (!paths.length) {
                        imageContent = '<div style="font-size:4rem;display:flex;align-items:center;justify-content:center;height:100%">🪵</div>';
                    } else if (paths.length === 1) {
                        const url = getImageUrl(paths[0]);
                        imageContent = url && url.startsWith('http')
                            ? `<img src="${url}" alt="${item.name}">`
                            : `<div style="font-size:4rem;display:flex;align-items:center;justify-content:center;height:100%">${url || '🪵'}</div>`;
                    } else {
                        const cid = `carousel-${item.id}`;
                        const slides = paths.map((p, i) => {
                            const u = getImageUrl(p);
                            return `<div class="carousel-slide"><img src="${u}" alt="${item.name} photo ${i+1}"></div>`;
                        }).join('');
                        const dots = paths.map((_, i) =>
                            `<span class="carousel-dot${i===0?' active':''}" onclick="event.stopPropagation();event.preventDefault();goSlide('${cid}',${i})"></span>`
                        ).join('');
                        imageContent = `
                            <div class="carousel" id="${cid}" data-idx="0"
                                 ontouchstart="tcStart(event,this)" ontouchend="tcEnd(event,this)">
                                <div class="carousel-track">${slides}</div>
                                <button class="carousel-btn prev" onclick="event.stopPropagation();event.preventDefault();shiftSlide('${cid}',-1)">&#8249;</button>
                                <button class="carousel-btn next" onclick="event.stopPropagation();event.preventDefault();shiftSlide('${cid}',1)">&#8250;</button>
                                <div class="carousel-dots">${dots}</div>
                            </div>`;
                    }

                    // Video overlay (if item has a video)
                    const videoUrl = item.video_path ? getImageUrl(item.video_path) : null;
                    const videoHtml = videoUrl ? `
                        <video class="card-video" src="${videoUrl}" muted loop playsinline preload="none"></video>
                        <div class="card-video-icon">▶</div>` : '';

                    const hoverAttrs = videoUrl
                        ? `onmouseenter="playCardVideo(this)" onmouseleave="pauseCardVideo(this)"`
                        : '';

                    return `
                        <a class="item-card" href="/jalenswoodshop/item?id=${item.id}" style="text-decoration:none;color:inherit;display:block">
                            <div class="item-image" ${hoverAttrs}>${imageContent}${videoHtml}</div>
                            <div class="item-details">
                                <h3 class="item-name">${item.name}</h3>
                                ${item.tagline ? `<p class="item-tagline">${item.tagline}</p>` : ''}
                                <div class="item-footer">
                                    <span class="item-price">$${parseFloat(item.price).toFixed(2)}</span>
                                    <span class="purchase-btn">Buy Now</span>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading items:', error);
                loading.textContent = 'Error loading items. Please refresh the page.';
            }
        }

        loadItems();
        // Update cart badge
        try{const n=JSON.parse(localStorage.getItem('jws_cart')||'[]').length;document.getElementById('cartBadge').textContent=n;}catch(_){}
    </script>
    <script>
    // ── Carousel helpers ──────────────────────────────────────────
    function goSlide(id, idx) {
        const c     = document.getElementById(id);
        const total = c.querySelectorAll('.carousel-slide').length;
        idx = (idx + total) % total;
        c.dataset.idx = idx;
        c.querySelector('.carousel-track').style.transform = `translateX(-${idx * 100}%)`;
        c.querySelectorAll('.carousel-dot').forEach((d, i) =>
            d.classList.toggle('active', i === idx));
    }

    function shiftSlide(id, dir) {
        const c = document.getElementById(id);
        goSlide(id, parseInt(c.dataset.idx) + dir);
    }

    // Touch swipe support
    function tcStart(e, el) { el._tx = e.touches[0].clientX; }
    function tcEnd(e, el) {
        const diff = el._tx - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) shiftSlide(el.id, diff > 0 ? 1 : -1);
    }
    </script>
</body>
</html>
